spring:
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:mysql://127.0.0.1:3306/material_management?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${WAREHOUSE_DB_USER:warehouse}
    password: ${WAREHOUSE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
      host: ${WAREHOUSE_REDIS_HOST:127.0.0.1}
      port: ${WAREHOUSE_REDIS_PORT:6379}
server:
  address: ${WAREHOUSE_BIND_ADDRESS:127.0.0.1}
  port: ${WAREHOUSE_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${WAREHOUSE_COOKIE_SECURE:false}
